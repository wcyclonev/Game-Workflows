name: Bot-Hosting Auto Renew

on:
  schedule:
    # 北京时间中午12点 = UTC 04:00
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        working-directory: scripts/Bothosting-New
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Install gost (proxy converter)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Start gost proxy (if proxy configured)
        env:
          NOVIXLINK_SOCKS_PROXY: ${{ secrets.NOVIXLINK_SOCKS_PROXY }}
        if: ${{ env.NOVIXLINK_SOCKS_PROXY != '' }}
        run: |
          nohup gost -L=:1080 -F="$NOVIXLINK_SOCKS_PROXY" > /tmp/gost.log 2>&1 &
          sleep 5
          echo "Gost proxy started on 127.0.0.1:1080"
          ps aux | grep gost || echo "Warning: gost may not be running"
          netstat -tlnp | grep 1080 || echo "Port 1080 not found"

      - name: Run renew script
        working-directory: scripts/Bothosting-New
        env:
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          DISCORD_TOKEN_1: ${{ secrets.DISCORD_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_PROXY: ${{ secrets.NOVIXLINK_SOCKS_PROXY != '' && 'true' || 'false' }}
          PROXY_SERVER: "http://127.0.0.1:1080"
          HEADLESS: "true"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Commit and push cookie.json if changed
        working-directory: scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet Bothosting-New/cookie.json; then
            echo "✅ cookie.json 未变化，无需提交"
          else
            echo "🔄 cookie.json 已更新，提交更改..."
            git add Bothosting-New/cookie.json
            git commit -m "chore: auto update SESSION_TOKEN [skip ci]"
            git push
            echo "✅ cookie.json 已推送到仓库"
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: scripts/Bothosting-New/screenshots/
          retention-days: 7
          if-no-files-found: warn
