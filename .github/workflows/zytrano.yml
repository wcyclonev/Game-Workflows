name: Zytrano Auto Renew

on:
  schedule:
    # 北京时间每周日 20:00 = UTC 周日 12:00
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        working-directory: scripts/Zytrano
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget curl
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install -r requirements.txt
          python -m seleniumbase install chromedriver
          python -m seleniumbase install uc_driver

      - name: Install gost (proxy converter)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Start gost proxy (if proxy configured)
        env:
          NOVIXLINK_SOCKS_PROXY: ${{ secrets.NOVIXLINK_SOCKS_PROXY }}
        if: ${{ env.NOVIXLINK_SOCKS_PROXY != '' }}
        run: |
          nohup gost -L=:1080 -F="$NOVIXLINK_SOCKS_PROXY" > /tmp/gost.log 2>&1 &
          sleep 5
          echo "Gost proxy started on 127.0.0.1:1080"
          ps aux | grep gost || echo "Warning: gost may not be running"
          netstat -tlnp | grep 1080 || echo "Port 1080 not found"

      - name: Run renew script
        working-directory: scripts/Zytrano
        env:
          REMEMBER_WEB_COOKIE: ${{ secrets.REMEMBER_WEB_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_PROXY: ${{ secrets.NOVIXLINK_SOCKS_PROXY != '' && 'true' || 'false' }}
          PROXY_SERVER: "http://127.0.0.1:1080"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: scripts/Zytrano/screenshots/
          retention-days: 7
          if-no-files-found: warn
