name: Axenthost Auto Claim

on:
#  schedule:
    # 每小时的第5分钟运行（UTC时间）
#    - cron: '5 * * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        working-directory: scripts/Axenthost
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install -r requirements.txt
          seleniumbase install chromedriver

      - name: Install gost (proxy converter)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Start gost proxy (if proxy configured)
        env:
          LEGEND_JP_SOCKS_PROXY: ${{ secrets.LEGEND_JP_SOCKS_PROXY }}
        if: ${{ env.LEGEND_JP_SOCKS_PROXY != '' }}
        run: |
          # 启动 gost 作为后台进程，将节点转换为本地 HTTP 代理
          nohup gost -L=:1080 -F="$LEGEND_JP_SOCKS_PROXY" > /tmp/gost.log 2>&1 &
          sleep 5
          echo "Gost proxy started on 127.0.0.1:1080"
          # 验证 gost 是否运行
          ps aux | grep gost || echo "Warning: gost may not be running"
          netstat -tlnp | grep 1080 || echo "Port 1080 not found"
      
      - name: Run claim script
        working-directory: scripts/Axenthost
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_PROXY: ${{ secrets.LEGEND_JP_SOCKS_PROXY != '' && 'true' || 'false' }}
          PROXY_SERVER: "http://127.0.0.1:1080"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py
      
      - name: Upload server status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-status-${{ github.run_number }}
          path: scripts/Axenthost/*.json
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            scripts/Axenthost/screenshots/*.png
            scripts/Axenthost/screenshots/*.html
          retention-days: 7
          if-no-files-found: ignore
