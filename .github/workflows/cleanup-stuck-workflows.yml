name: Nuclear Cleanup (Delete All Queued)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DELETE 确认删除所有 queued 工作流'
        required: true
        type: string

jobs:
  nuclear-cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: 获取所有 queued 工作流
        id: get-runs
        run: |
          echo "查找所有 queued 状态的工作流..."
          
          # 使用 GitHub API 直接获取
          RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=queued&per_page=100")
          
          echo "$RESPONSE" | jq -r '.workflow_runs[] | "\(.id) - \(.name) - \(.created_at)"'
          
          RUN_IDS=$(echo "$RESPONSE" | jq -r '.workflow_runs[].id')
          echo "run_ids<<EOF" >> $GITHUB_OUTPUT
          echo "$RUN_IDS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          COUNT=$(echo "$RUN_IDS" | wc -l)
          echo "找到 $COUNT 个 queued 工作流"
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      
      - name: 尝试多种方法删除
        run: |
          RUN_IDS="${{ steps.get-runs.outputs.run_ids }}"
          
          if [ -z "$RUN_IDS" ]; then
            echo "没有找到 queued 状态的工作流"
            exit 0
          fi
          
          echo "开始删除工作流..."
          
          echo "$RUN_IDS" | while read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "处理运行 ID: $RUN_ID"
              
              # 方法 1: 使用 gh CLI 取消
              echo "方法 1: gh run cancel"
              gh run cancel "$RUN_ID" -R ${{ github.repository }} 2>&1 || echo "取消失败"
              
              sleep 2
              
              # 方法 2: 使用 API 取消
              echo "方法 2: API cancel"
              curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel" \
                | jq -r '.message // "已取消"'
              
              sleep 2
              
              # 方法 3: 使用 gh API 删除
              echo "方法 3: gh api delete"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$RUN_ID" 2>&1 || echo "gh api 删除失败"
              
              sleep 2
              
              # 方法 4: 使用 curl 删除
              echo "方法 4: curl delete"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID")
              
              echo "HTTP 状态码: $HTTP_CODE"
              
              if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "✅ 成功删除"
              else
                echo "⚠️  删除可能失败 (HTTP $HTTP_CODE)"
                
                # 检查工作流状态
                STATUS=$(gh run view "$RUN_ID" -R ${{ github.repository }} --json status -q .status 2>/dev/null || echo "unknown")
                echo "当前状态: $STATUS"
              fi
              
              sleep 3
            fi
          done
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 清理尝试完成！"
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      
      - name: 最终状态检查
        run: |
          echo "═══════════════════════════════════════"
          echo "最终工作流状态:"
          echo "═══════════════════════════════════════"
          gh run list -R ${{ github.repository }} --limit 30
          
          echo ""
          echo "Queued 工作流:"
          gh run list -R ${{ github.repository }} --json status,name,databaseId --limit 100 | \
            jq -r '.[] | select(.status=="queued") | "\(.databaseId) - \(.name)"'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
