name: Host-Ship Auto Renew

on:
  schedule:
    # 每7天中午12点运行 (UTC+8 = UTC 04:00)，每周日
    - cron: '0 4 * * 0'
  workflow_dispatch:  # 手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts
      
      - name: Set up WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: client

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run renew script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts/Host-Ship
        run: python main.py
      
      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-responses
          path: scripts/Host-Ship/*.json
          retention-days: 7
          if-no-files-found: ignore
