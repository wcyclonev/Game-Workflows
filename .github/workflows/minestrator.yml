name: MineStrator Auto Keepalive

on:
  # schedule:
  #   # 每2小时运行一次
  #   - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: scripts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: scripts/Minestrator
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget
          pip install -r requirements.txt

      - name: Install gost (proxy converter)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Start gost proxy (if proxy configured)
        env:
          SOCKS_PROXY_URL: ${{ secrets.SOCKS_PROXY_URL }}
        if: ${{ env.SOCKS_PROXY_URL != '' }}
        run: |
          nohup gost -L=:1080 -F="$SOCKS_PROXY_URL" > /tmp/gost.log 2>&1 &
          sleep 5
          echo "Gost proxy started on 127.0.0.1:1080"

      - name: Run restart script
        working-directory: scripts/Minestrator
        env:
          USERNAME: ${{ secrets.MINESTRATOR_USERNAME }}
          PASSWORD: ${{ secrets.MINESTRATOR_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_PROXY: ${{ secrets.SOCKS_PROXY_URL != '' && 'true' || 'false' }}
          PROXY_SERVER: "http://127.0.0.1:1080"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-screenshots-${{ github.run_number }}
          path: scripts/Minestrator/*.png
          retention-days: 30
          if-no-files-found: ignore
